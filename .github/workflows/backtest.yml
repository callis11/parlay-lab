name: Backtest pull (historical NFL odds)
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test with one game only (about 150 credits)"
        type: boolean
        default: true
      reserve:
        description: "Stop before credits drop below this"
        default: "15000"
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          set -o pipefail
          mkdir -p backtest/raw
          node backtest/fetch.js 2>&1 | tee backtest/raw/last-run.log
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TEST: ${{ inputs.test && '1' || '0' }}
          RESERVE: ${{ inputs.reserve }}
      - if: always()
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          mkdir -p backtest/raw
          git add backtest/raw
          git diff --cached --quiet || (git commit -m "Backtest: historical NFL odds" && git pull --rebase --autostash origin main && git push)
