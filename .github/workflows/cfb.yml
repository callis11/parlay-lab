name: Refresh College
on:
  # Main timer is Cloudflare (schedule.json). This daily run is a backup. Each odds pull costs about 3 credits.
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: "Started by the Cloudflare timer (skips if refreshed in the last 45 minutes)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  cfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: f
        run: node cfb/fetch.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AUTO_GUARD: ${{ github.event_name == 'schedule' || inputs.auto }}
      # ESPN scores (free) run every time to keep grading current
      - run: node cfb/build.js
      - run: node picks.js
        env:
          SPORT: cfb
          RECORD: ${{ steps.f.outputs.fetched == 'true' }}
      - run: |
          git pull --rebase --autostash origin main || true
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add cfb/*.json
          git diff --cached --quiet || (git commit -m "Update college odds and results" && git push)
