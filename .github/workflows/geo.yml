name: Build state borders (one time)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save us-atlas@3 topojson-client@3
      - run: node tools/mkstates.js states.json
      - run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add states.json
          git commit -m "State borders for the location check" && git pull --rebase origin main && git push
