name: College history pull (game lines)
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test with one snapshot only (30 credits)"
        type: boolean
        default: true
      seasons:
        description: "Seasons, newest first"
        default: "2025,2024,2023"
      reserve:
        description: "Stop before credits drop below this"
        default: "40000"
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          set -o pipefail
          mkdir -p backtest/raw
          node backtest/cfb-fetch.js 2>&1 | tee backtest/raw/cfb-last-run.log
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TEST: ${{ inputs.test && '1' || '0' }}
          CFB_SEASONS: ${{ inputs.seasons }}
          RESERVE: ${{ inputs.reserve }}
      - if: always()
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add backtest/raw
          git diff --cached --quiet || (git commit -m "College history: game lines" && git pull --rebase --autostash origin main && git push)
