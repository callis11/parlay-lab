name: Refresh odds
on:
  # Times are UTC, set for Eastern Standard Time (Nov-Mar). In EDT they run one hour later.
  # Minutes are off the hour on purpose: GitHub delays or skips more scheduled runs at :00.
  # The paid odds pull only happens on days with an NFL game (gameday.js); other runs just grade results.
  schedule:
    - cron: "17 15,19,23 * * 1-6"   # 10:17 AM, 2:17 PM, 6:17 PM ET, Mon-Sat
    - cron: "17 14-18,20,23 * * 0"  # Sunday: hourly 9:17 AM-1:17 PM ET, then 3:17 and 6:17 PM
    - cron: "7 0 * * 1,2,5"        # 7:07 PM ET before Sunday, Monday and Thursday night games
    - cron: "43 14 * * 2"          # Tuesday 9:43 AM ET: early-week lines, even with no game
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh even if there's no game today"
        type: boolean
        default: true
      auto:
        description: "Started by the Cloudflare timer (skips if refreshed in the last 45 minutes)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: gd
        run: node gameday.js
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) || github.event.schedule == '43 14 * * 2' }}
          AUTO_GUARD: ${{ github.event_name == 'schedule' || inputs.auto }}
          GUARD_MIN: ${{ github.event_name == 'schedule' && '60' || '12' }}
      - if: steps.gd.outputs.play == 'true'
        run: node fetch-odds.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - if: steps.gd.outputs.play == 'true'
        run: node build-data.js
      # Save this run's slips (game days only), then grade finished ones (every run, free data)
      - run: node picks.js
        env:
          RECORD: ${{ steps.gd.outputs.play }}
      - run: |
          git pull --rebase --autostash origin main || true
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add odds.json data.json picks.json history.json calibration.json cards.json gradebook.json graded-legs.json
          git diff --cached --quiet || (git commit -m "Update odds" && git push)
