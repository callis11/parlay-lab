name: Refresh odds
on:
  schedule:
    # Checks 3 times a day, but only pulls odds on days with an NFL game
    - cron: "0 14,18,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh even if there's no game today"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: gd
        run: node gameday.js
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      - if: steps.gd.outputs.play == 'true'
        run: node fetch-odds.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - if: steps.gd.outputs.play == 'true'
        run: node build-data.js
      # Save this run's slips (game days only), then grade finished ones (every run, free data)
      - run: node picks.js
        env:
          RECORD: ${{ steps.gd.outputs.play }}
      - run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add odds.json data.json picks.json
          git diff --cached --quiet || (git commit -m "Update odds" && git push)
