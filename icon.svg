<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2D52"/><stop offset="1" stop-color="#0E1730"/></linearGradient>
    <radialGradient id="bub" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#9FF0C6"/><stop offset=".55" stop-color="#2DBE7A"/><stop offset="1" stop-color="#17885A"/></radialGradient>
    <radialGradient id="gold" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FFF1A6"/><stop offset=".55" stop-color="#F7C600"/><stop offset="1" stop-color="#D49A00"/></radialGradient>
    <clipPath id="flask"><path d="M432 330 V420 L250 770 Q232 812 276 812 H748 Q792 812 774 770 L592 420 V330 Z"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 650) scale(.98) translate(-512 -565)">
    <g clip-path="url(#flask)">
      <path d="M200 610 Q330 560 460 610 T720 610 T980 610 V900 H200 Z" fill="#2DBE7A"/>
      <path d="M200 610 Q330 560 460 610 T720 610 T980 610" fill="none" stroke="#7FE3B0" stroke-width="14" opacity=".7"/>
      <!-- fizz inside the liquid -->
      <g fill="#C9F7DE" opacity=".85"><circle cx="380" cy="770" r="12"/><circle cx="650" cy="740" r="15"/><circle cx="600" cy="790" r="9"/><circle cx="420" cy="690" r="10"/></g>
      <!-- first line, born in the flask -->
      <circle cx="512" cy="720" r="58" fill="url(#bub)" stroke="#C9F7DE" stroke-width="6"/>
      <text x="512" y="737" text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" font-size="46" fill="#0E1730">-110</text>
    </g>
    <!-- bubbles rising through the neck -->
    <circle cx="530" cy="470" r="20" fill="none" stroke="#9FF0C6" stroke-width="8"/>
    <circle cx="488" cy="395" r="13" fill="#9FF0C6"/>
    <path d="M432 330 V420 L250 770 Q232 812 276 812 H748 Q792 812 774 770 L592 420 V330" fill="none" stroke="#F7C600" stroke-width="52" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="384" y1="318" x2="640" y2="318" stroke="#F7C600" stroke-width="52" stroke-linecap="round"/>
  </g>
  <!-- the odds grow as they float out -->
  <g font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" text-anchor="middle">
    <circle cx="566" cy="272" r="72" fill="url(#bub)" stroke="#C9F7DE" stroke-width="7"/>
    <text x="566" y="291" font-size="54" fill="#0E1730">+150</text>
    <circle cx="372" cy="168" r="96" fill="url(#bub)" stroke="#C9F7DE" stroke-width="8"/>
    <text x="372" y="193" font-size="70" fill="#0E1730">+300</text>
    <circle cx="700" cy="122" r="108" fill="url(#gold)" stroke="#FFF1A6" stroke-width="8"/>
    <text x="700" y="150" font-size="80" fill="#0E1730">+600</text>
  </g>
</svg>
